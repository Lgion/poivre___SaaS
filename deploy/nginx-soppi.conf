# Configuration Nginx pour les 3 sous-domaines de l'écosystème Plantation Soppi
# À placer dans /etc/nginx/sites-available/soppi.conf sur votre VPS

# 1. Site d'Appel à Financement Participatif (50M FCFA)
server {
    listen 80;
    server_name invest.poivredelame.ci;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Boutique E-Commerce B2C & Portail Contrats B2B
server {
    listen 80;
    server_name boutique.poivredelame.ci poivredelame.ci www.poivredelame.ci;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Portail SaaS Coopérative & Pilotage Stocks / Devis Machines
server {
    listen 80;
    server_name erp.poivredelame.ci;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

